# Agent0-VL RL profile for two 24 GiB RTX 4090 GPUs.
#
# This inherits the paper/SERC configuration and changes only hardware-facing
# limits. GRPO N=8, the eight-step SERC trajectory, reward calculation,
# verifier, repair, and tool execution remain unchanged.

defaults:
  - agent0_trainer
  - _self_

data:
  train_batch_size: 2
  # Multimodal token expansion makes some 200-row prompts exceed the base
  # profile's 4096 limit. 6144 + 3072 trajectory tokens fits 9216 context.
  max_prompt_length: 6144

actor_rollout_ref:
  actor:
    activation_cpu_offload: True
    response_only_logits: True
    ppo_mini_batch_size: 1
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: True
    ppo_max_token_len_per_gpu: 9216
    fsdp_config:
      param_offload: True
      optimizer_offload: True
      backward_prefetch: backward_post

  rollout:
    tensor_model_parallel_size: 2
    # The BF16 TP=2 vLLM weights use about 12.2--12.5 GiB per 4090;
    # 0.50 leaves no KV-cache block, while 0.65 initialized successfully.
    gpu_memory_utilization: 0.65
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_hf
    sleep_level: 2
    # Generation already succeeds at six-way scheduling. The lower context
    # and trajectory ceilings target the measured single-sample backward peak.
    max_num_seqs: 6
    max_model_len: 9216
    max_num_batched_tokens: 9216
    max_total_response_length: 3072
    log_prob_micro_batch_size_per_gpu: 1
    n: 8

  ref:
    log_prob_micro_batch_size_per_gpu: 1

trainer:
  n_gpus_per_node: 2
