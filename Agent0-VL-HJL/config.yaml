    local_data:
      sft_root: data/sft/checkpointed_v1/candidates
      sft_output: data/sft/checkpointed_v1/accepted_1000.jsonl
      rl_warmup: data/rl/checkpointed_v1/warmup_200.parquet
      rl_formal: data/rl/checkpointed_v1/formal_200.parquet
      validation: data/rl/checkpointed_v1/validation_10.parquet
    sft_data_generation:
      min_steps: 1
    checkpointed:
      protocol_version: agent0.checkpointed.v1
      adapter_strategy: separate
      adapter_bundle: null
      limits:
        max_solver_segments: 8
        max_repair_rounds: 2
        max_verifier_tool_rounds: 4
        request_timeout_seconds: 300
        session_timeout_seconds: 1800
        tool_timeout_seconds: 10
        context_margin_tokens: 8
        max_model_tokens: 40960
        per_generation_tokens: 4096
        solve_prompt_tokens: 8192
        solve_response_tokens: 30720
        repair_response_tokens: 30720
        verify_response_tokens: 8192
        teacher_reply_tokens: 0
        sft_solve_tokens: 30720
        sft_repair_tokens: 30720
        sft_verify_tokens: 30720
      sampling:
        problems_per_step: 4
